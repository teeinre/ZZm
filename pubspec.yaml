name: zzmore_app
description: "ZZmore Store – African-owned multi-vendor marketplace mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.0.5
  flutter_secure_storage: ^9.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  intl: ^0.18.1
  google_fonts: ^6.1.0
  equatable: ^2.0.5
  connectivity_plus: ^5.0.1
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  mockito: ^5.4.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "ZZmore Logo.png"
  adaptive_icon_background: "#E67E14"
  adaptive_icon_foreground: "ZZmore Logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
