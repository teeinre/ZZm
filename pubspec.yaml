name: zzmore_app
description: "ZZmore Store – African-owned multi-vendor marketplace mobile app."
publish_to: 'none'
version: 3.3.1+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  flutter_secure_storage: ^10.3.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  google_fonts: ^8.2.0
  equatable: ^2.0.7
  connectivity_plus: ^7.3.0
  flutter_svg: ^2.2.1
  image_picker: ^1.1.2
  http_parser: ^4.1.2
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "ZZmore Logo.png"
  adaptive_icon_background: "#E67E14"
  adaptive_icon_foreground: "ZZmore Logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
