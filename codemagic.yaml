workflows:
  # ── iOS Build (App Store) ──
  build-ios:
    name: Build iOS (ZZmore Store)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: store.zzmore.app
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Set version from pubspec
        script: |
          BUILD_NUMBER=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d '+' -f2)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Runner/Info.plist
      - name: Set up code signing
        script: |
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "API key found — configuring App Store code signing"
            keychain initialize
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create
            keychain add-certificates
            xcode-project use-profiles
          else
            echo "No API key set — building unsigned IPA (you must sign it manually)"
          fi
      - name: Build iOS IPA
        script: |
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            flutter build ipa --release \
              --export-options-plist=$HOME/export_options.plist
          else
            flutter build ios --release --no-codesign
          fi
      - name: Verify, package, and rename IPA
        script: |
          echo "=== Searching for existing IPA ==="
          find build/ -name "*.ipa" 2>/dev/null | head -10

          IPA_PATH=$(find build/ -name "*.ipa" | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "=== No .ipa found — packaging from .xcarchive or .app ==="
            APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find build/ -name "*.app" -type d 2>/dev/null | head -1)
            fi
            if [ -n "$APP_PATH" ]; then
              echo "Found .app at: $APP_PATH"
              mkdir -p build/ios/ipa
              cd build/ios/ipa
              mkdir -p Payload
              cp -R "../../../$APP_PATH" Payload/
              zip -r Zzmorestore.ipa Payload
              rm -rf Payload
              echo "Packaged .app into Zzmorestore.ipa — NOTE: unsigned, sign manually before distribution"
            else
              echo "ERROR: Neither .ipa nor .app found in build/"
              echo "=== Listing contents of build/ios/ ==="
              find build/ios -maxdepth 3 -type f 2>/dev/null | head -40
              exit 1
            fi
          else
            echo "Found existing IPA at: $IPA_PATH"
            mkdir -p build/ios/ipa
            mv "$IPA_PATH" build/ios/ipa/Zzmorestore.ipa
          fi

          echo "=== Final artifact ==="
          ls -lh build/ios/ipa/Zzmorestore.ipa
    artifacts:
      - build/ios/ipa/Zzmorestore.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false

  # ── Android Build ──
  build-android:
    name: Build Android (ZZmore Store)
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
      - name: Rename APK
        script: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Zzmorestore.apk
    artifacts:
      - build/app/outputs/flutter-apk/Zzmorestore.apk
