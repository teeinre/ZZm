workflows:
  # ── iOS Build ──
  build-ios:
    name: Build iOS (ZZmore Store)
    environment:
      flutter: stable          # uses latest stable Flutter
      xcode: latest            # uses latest Xcode
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS (without signing - test build)
        script: |
          flutter build ios --no-codesign --release
    artifacts:
      - build/ios/ipa/*.ipa

  # ── Android Build (optional, for reference) ──
  build-android:
    name: Build Android (ZZmore Store)
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
