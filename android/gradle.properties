org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# ── Release Build Optimizations ────────────────────────────
# Enable parallel builds for faster compilation
org.gradle.parallel=true
# Enable build caching
org.gradle.caching=true
# Configuration cache disabled – not yet compatible with Flutter Gradle plugin
org.gradle.configuration-cache=false
# Enable non-transitive R classes for smaller DEX
android.nonTransitiveRClass=true
# Display build features
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# ── R8 Full Mode ──
# Enables aggressive optimizations: inlining, class merging, dead code elimination
#android.enableR8.fullMode=true  # disabled: too slow on this machine, use for Play Store release

# ── Network resilience (flaky/low-bandwidth connections) ──
# Defaults are too aggressive for slow links and cause "Read timed out"
# while downloading Gradle/Android artifacts (bundletool, kotlin-compiler, guava).
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=1000
